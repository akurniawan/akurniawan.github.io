{{ $first := index (where site.RegularPages.ByDate "Section" "posts") 0 }}
<div class="wrap">
  <span>
    &copy; {{ with $first }}{{ .Date.Year }}&ndash;{{ end }}{{ now.Year }} {{ lower site.Params.author }}
  </span>
  <nav aria-label="Footer">
    {{ with site.Home.OutputFormats.Get "rss" }}<a href="{{ .RelPermalink }}">rss</a>{{ end }}
    <button class="theme-key" type="button" aria-label="Change color theme">
      :theme <span class="value">gruvbox</span>
    </button>
    <a href="#top">top &uarr;</a>
  </nav>
</div>
