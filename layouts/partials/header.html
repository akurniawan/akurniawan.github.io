<div class="wrap">
  <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }}, home">
    {{- site.Params.brand | default "akur" -}}<span class="cursor" aria-hidden="true"></span>
  </a>

  <nav class="nav" aria-label="Main">
    {{- $section := .Section }}
    {{- $name := lower .Name }}
    {{- range site.Params.menu }}
    {{- $active := or (eq .name $name) (and (eq .name "posts") (eq $section "posts")) }}
    <a href="{{ .url | relURL }}" {{ if $active }}aria-current="page"{{ end }}>{{ .name }}</a>
    {{- end }}
  </nav>
</div>
