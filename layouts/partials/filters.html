{{/* all / <category> ... bar shown above post lists. */}}
{{ $current := . }}
<ul class="filters" aria-label="Filter by category">
  {{ with site.GetPage "/posts" }}
  <li><a href="{{ .RelPermalink }}" {{ if eq $current.RelPermalink .RelPermalink }}aria-current="page"{{ end }}>all</a></li>
  {{ end }}
  {{ range site.Taxonomies.categories.ByCount }}
  <li><a href="{{ .Page.RelPermalink }}" {{ if eq $current.RelPermalink .Page.RelPermalink }}aria-current="page"{{ end }}>{{ .Page.LinkTitle | lower }}</a></li>
  {{ end }}
</ul>
