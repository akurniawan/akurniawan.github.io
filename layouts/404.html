{{ define "main" }}
<header class="page-head">
  <p class="id">{{ site.Params.partNumber | default "AK-1" }} · errata</p>
  <h1>Erratum 404</h1>
  <p>The page you asked for is not in this revision.</p>
</header>

<section class="panel errata" aria-label="Errata">
  <div class="panel-b">
    <table class="dt">
      <thead><tr><th scope="col">item</th><th scope="col">description</th><th scope="col">workaround</th></tr></thead>
      <tbody>
        <tr>
          <td>404</td>
          <td>No document exists at <span class="num" data-path>this address</span>.</td>
          <td>Start from the <a href="{{ "/" | relURL }}">front panel</a>, or look the note up in the <a href="{{ "/posts/" | relURL }}">revision history</a>.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
<script>
  document.querySelector("[data-path]").textContent = location.pathname;
</script>
{{ end }}
